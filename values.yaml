# rhcl-connectivity-workshop -- valores do chart
#
# O que este chart faz: um Job (ansible-runner) que clona o repositorio da demo
# numa TAG, roda o provision.sh dele (operadores, Service Mesh, plataforma,
# gateway, camada de demo, tracing, dashboards), publica o Showroom e escreve o
# ConfigMap 'userinfo' que o RHDP mostra na pagina do pedido.
#
# Por que o padrao Ansible e nao o Helm puro: o provisionamento tem ordem com
# espera (CR do Kuadrant so depois da CRD; Route so depois do Service do
# Gateway), le o certificado wildcard do cluster e gera a camada de hostname.
# Nada disso e templating.
#
# Por que a camada de demo NAO e um Application do Argo: quatro atos editam
# objetos ao vivo (canario, fault injection, Limitador a zero, PERMISSIVE), e
# selfHeal os reverteria em segundos. O Job aplica 'oc apply -k' uma vez.

job:
  name: rhcl-workshop
  ttlSecondsAfterFinished: 3600
  restartPolicy: Never
  # o provisionamento completo leva ~25-40 min; o teto e generoso de proposito
  activeDeadlineSeconds: 5400

namespace:
  name: rhcl-workshop-runner
  create: true

# O repositorio DA DEMO (o motor), clonado numa tag. Promover o workshop e
# mudar 'ref'. Nunca 'main': a demo evolui, o workshop nao pode quebrar junto.
demo:
  repoUrl: "https://github.com/workshop-tanaka/rhcl-connectivity-demo.git"
  ref: "workshop-v0.50"
  # etapas do provision.sh, na ordem. Sem 'gitlab', 'gitops' (o Field Content
  # CI ja instala o GitOps) e sem os pesados (cicd, registry, security).
  # 'consoles' entra pelo Kiali e pelos PodMonitors do Service Mesh (sem eles
  # o preflight avisa 8 vezes e o ato 5 abre vazio); o build da console
  # customizada fica fora por CUSTOM_CONSOLE=0 (workshop-v0.2+).
  # 'gitlab' entra na v0.29: o repositorio do workshop mora no cluster (o
  # roteiro para todos, e um projeto privado por participante), e nada no guia
  # aponta para fora do ambiente. E a etapa mais lenta: ~17 min medidos, e por
  # isso vem por ULTIMO -- o resto do ambiente ja esta de pe enquanto ela sobe.
  stages: "operators mesh platform gateway devportal demo consoles tracing dashboards gitlab"
  # OPTIONAL=1 instala kiali, tempo, otel e grafana -- sem eles os atos 4 e 5
  # ficam sem tela
  optional: "1"
  timeout: "900"

# O repositorio DESTE workshop: o Showroom clona daqui o conteudo Antora.
# A SESSAO deste ambiente: 'rhcl', 'ossm', 'rhsi' ou vazio (a completa).
# Decide o MENU do guia -- do instrutor e, pelo tenant.sh, de cada participante.
# O workshop tem um menu por sessao: tres dedicadas a um produto e a completa.
# 'rhcl' muda tambem o AMBIENTE: o cluster sobe sem Service Mesh, com o Gateway
# do provedor nativo do OpenShift (provision.sh, _sem_mesh). 'ossm' e 'rhsi' por
# enquanto so mudam o menu. Valor fora da lista e tratado como vazio.
workshop:
  foco: "rhcl"

ansible:
  repository:
    url: "https://github.com/workshop-tanaka/rhcl-connectivity-workshop.git"
    # TAG, nao branch. As tres refs desta onda carregam o MESMO nome, e e o que
    # torna dois ambientes comparaveis: com 'main' aqui, o pedido de segunda e
    # o de quarta nao sao o mesmo workshop, e uma correcao no meio da semana faz
    # os antigos divergirem sem explicacao. Ver docs/FROTA.md (G1) na demo.
    branch: "workshop-v0.50"
    path: "playbooks"
  playbook: "site.yml"
  requirements:
    - ansible-core
    # FIXADO. Sem versao, o Job instalava a ultima a cada pedido: a 37.0.0
    # tirou 'kubernetes.client.apis.core_v1_api', que o k8s_exec do
    # kubernetes.core 3.2.0 importa, e o provisionamento passou a morrer em
    # "name 'core_v1_api' is not defined" no passo que prepara o terminal --
    # com o cluster inteiro ja de pe (medido em 2026-10-07, reaplicando a onda;
    # a 34.1.0 importa, conferido).
    - kubernetes==34.1.0
    - PyYAML
    - requests
  collections:
    - kubernetes.core:==3.2.0
    - community.general:==9.5.0

showroom:
  content:
    repoUrl: "https://github.com/workshop-tanaka/rhcl-connectivity-workshop.git"
    # idem: o Showroom constroi o conteudo na subida do pod, e com 'main' cada
    # pod recriado podia servir um conteudo diferente do que foi validado.
    repoRef: "workshop-v0.50"
    antoraPlaybook: "site.yml"
  # guid entra no nome do namespace (showroom-<guid>) e no titulo
  guid: "rhcl"

# ubi9/python-311 traz git, curl e python3; o 'oc' vem do proprio cluster
# (Service downloads em openshift-console), sem depender de mirror externo.
image:
  repository: registry.redhat.io/ubi9/python-311
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

serviceAccount:
  name: rhcl-workshop-runner

# cluster-admin, sem rodeio: o provision.sh cria Subscriptions, CRs do Istio,
# edita o cluster-monitoring-config e copia o certificado do router. Uma
# ClusterRole enumerada aqui seria uma lista que envelhece a cada etapa nova.
rbac:
  create: true

syncWave:
  rbac: "1"
  job: "2"

# Injetados pelo Field Content workload (nao editar)
deployer:
  domain: ""
  apiUrl: ""
