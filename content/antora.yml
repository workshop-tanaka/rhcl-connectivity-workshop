    # A linha de credencial de cada tela sai daqui -- e SO do cluster, na
    # hora. Aqui elas nascem VAZIAS de proposito, e e a escolha segura: com o
    # atributo vazio, a pagina troca a linha de credencial por um ponteiro
    # honesto. Se um dia um valor de mentira fosse parar aqui, o participante
    # o leria como se fosse a senha do ambiente dele.
    # O console do OpenShift e OUTRA credencial: a persona do Keycloak nao
    # tem papel de RBAC no cluster, entao escrever a persona aqui produziria
    # um login que acontece e uma tela vazia. Nasce vazia, e a pagina aponta
    # para a pagina do pedido no RHDP, que e de onde ela vem de verdade.
    usuario_console: ''
    senha_console: ''
    # o login Plataforma (so leitura, um para a turma): so existe no modo de
    # turma, e o guia so fala dele com o atributo preenchido
    argocd_url: ''
    usuario_console_plataforma: ''
    senha_console_plataforma: ''
    usuario_persona: plat-eng
    senha_persona: ''
    keycloak_admin_user: ''
    keycloak_admin_senha: ''
    grafana_user: ''
    grafana_senha: ''
    gitlab_root_senha: ''
    demo_repo_url: https://github.com/workshop-tanaka/rhcl-connectivity-demo.git
    demo_ref: workshop-v0.1
    # A EDICAO: a versao que a audiencia ve (titulo do guia, Conferir o
    # ambiente). Muda so no corte de uma edicao (tags v*), nao a cada onda;
    # a onda (workshop-v*) e o build, e fica em demo_ref. O CI confere que os
    # dois titulos terminam com ela.
    edicao: "1.0"
