---
# Painel direito do Showroom. Cada aba e um IFRAME -- e e isso que decide o
# que pode entrar aqui.
#
# O QUE NAO PODE SER ABA (medido no cluster-nsvz5 em 2026-09-18, com curl -I):
#
#   console do OpenShift   x-frame-options: DENY
#   Grafana                x-frame-options: deny
#   Kiali                  x-frame-options: DENY
#   Tempo (UI do Jaeger)   a raiz nao manda o cabecalho, mas e so o gateway
#                          do observatorium devolvendo um JSON de caminhos;
#                          a UI de verdade e /<tenant>, que redireciona para
#                          o login do OpenShift -- e o OAuth manda DENY.
#
# Os tres recusam ser embutidos, e o navegador bloqueia sem dizer nada: a aba
# fica EM BRANCO. Nao ha configuracao do lado deles que afrouxe isso, e nem se
# deve procurar -- o cabecalho existe para impedir clickjacking. O exemplo de
# 'OCP Console' na documentacao do nookbag e anterior a esse endurecimento.
#
# Nenhuma tela de fora entra aqui, entao: elas vivem nos LINKS do roteiro,
# que abrem em aba do navegador (o '^' da macro do AsciiDoc). No painel fica
# o terminal, que e do proprio pod.
type: showroom
default_width: 38
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # O terminal do proprio pod. O traefik roteia /terminal -> ttyd:7681 com
  # stripPrefix (ver /etc/traefik/dynamic.yml no container traefik).
  - name: Terminal
    path: /terminal/
    port: 443

  # SEGUNDO terminal, e sao DUAS SESSOES de verdade, nao a mesma tela: o ttyd
  # sobe sem --max-clients e sem --once (`ttyd -p 7681 -P 5 -W /usr/bin/bash`),
  # entao cada iframe abre o proprio bash. Conferido no pod em 2026-09-20.
  #
  # Para que serve: partes que MUDAM ESTADO ficam melhores com um observador
  # do lado -- derrubar o Limitador na 2.4 enquanto o trafego roda, acompanhar
  # o log colorido da 4.2, provocar na 2.3 e observar aqui.
  #
  # E ABA, nao painel: o nookbag so entende abas. Painel empilhado como o do
  # template classico exigiria trocar de chart, e com ele viria wetty+SSH em
  # lugar do ttyd ja autenticado -- ou seja, o participante passaria a ter de
  # fazer login. Medido nos dois charts em 2026-09-20.
  - name: Terminal 2
    path: /terminal/
    port: 443
